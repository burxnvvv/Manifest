<script>
const T={en:"Spending time in another country broadens young people’s horizons in a way no textbook can. Living among people with different customs forces them to become independent, adaptable and more tolerant, while daily practice allows them to master a foreign language far faster than lessons at home. These qualities are highly valued by employers, particularly in international companies.",ru:"Время, проведённое в другой стране, расширяет кругозор молодых людей так, как не способен ни один учебник. Жизнь среди людей с другими обычаями делает их самостоятельными, гибкими и более терпимыми, а ежедневная практика позволяет освоить иностранный язык намного быстрее, чем уроки дома. Эти качества высоко ценят работодатели, особенно в международных компаниях."};
const W={en:"Work experience, whether paid or voluntary, develops qualities that no classroom can teach, such as punctuality, responsibility and the ability to deal with difficult people. Young people who work also learn the true value of effort and discover which careers suit them. As a result, they enter university or employment more mature and with a much clearer sense of direction.",ru:"Опыт работы, оплачиваемой или волонтёрской, развивает качества, которым не может научить ни один класс: пунктуальность, ответственность и умение общаться с трудными людьми. Работающие молодые люди также узнают истинную ценность усилий и понимают, какие профессии им подходят. В результате они приходят в университет или на работу более зрелыми и с гораздо более чётким представлением о своём направлении."};
const I={en:"Learning individually allows people to work at their own pace and focus specifically on what they find difficult. In a group, the pace is set by the majority, so faster learners become bored while slower ones fall behind. As a result, individual learning can be more efficient and considerably less stressful.",ru:"Индивидуальное обучение позволяет заниматься в собственном темпе и сосредоточиться именно на том, что даётся трудно. В группе темп задаёт большинство, поэтому более быстрые ученики скучают, а более медленные отстают. В результате индивидуальное обучение может быть эффективнее и значительно менее стрессовым."};
const Tc={en:"A qualified teacher offers advantages that self-study cannot provide. Teachers explain difficult concepts in different ways, identify mistakes immediately and correct them before they become habits. A learner relying solely on online videos, by contrast, may repeat the same error for months without even realising it.",ru:"Квалифицированный учитель даёт преимущества, которых самообучение обеспечить не может. Учителя объясняют сложные понятия разными способами, сразу замечают ошибки и исправляют их, пока они не вошли в привычку. Ученик же, полагающийся только на онлайн-видео, может месяцами повторять одну и ту же ошибку, даже не осознавая этого."};
const G={en:"Learning alongside others develops social and teamwork skills that are essential in adult life. Working in a group teaches people to listen, exchange ideas, resolve disagreements and take responsibility as part of a team. These skills give them a clear advantage later, since almost every modern workplace requires cooperation with others.",ru:"Обучение рядом с другими развивает социальные навыки и навыки командной работы, необходимые во взрослой жизни. Работа в группе учит слушать, обмениваться идеями, разрешать разногласия и брать на себя ответственность как часть команды. Эти навыки дают явное преимущество в дальнейшем, поскольку почти любое современное рабочее место требует сотрудничества с другими."};
const X={en:"Parents and schools should limit children’s screen time and encourage more physical activity instead. Exercise improves blood flow to the brain, reduces stress and helps children release energy that might otherwise make them restless. Schools that restrict phone use and introduce short physical breaks between lessons often report noticeable improvements in concentration and behaviour.",ru:"Родителям и школам следует ограничивать экранное время детей и вместо этого поощрять больше физической активности. Упражнения улучшают приток крови к мозгу, снижают стресс и помогают детям выплеснуть энергию, которая иначе делала бы их беспокойными. Школы, ограничивающие использование телефонов и вводящие короткие физические перерывы между уроками, часто сообщают о заметном улучшении концентрации и поведения."};
const R={en:"Reading develops concentration, imagination and the ability to follow complex ideas, whereas excessive screen use can weaken these skills. Short videos accustom the brain to instant stimulation, making longer and more demanding tasks increasingly difficult to sustain. Consequently, declining reading habits may partly explain why many young people struggle to concentrate for extended periods.",ru:"Чтение развивает концентрацию, воображение и способность следовать сложным идеям, тогда как чрезмерное использование экранов может ослабить эти навыки. Короткие видео приучают мозг к мгновенной стимуляции, из-за чего всё труднее выдерживать более длинные и требовательные задачи. Следовательно, снижение интереса к чтению может отчасти объяснять, почему многим молодым людям трудно концентрироваться в течение длительного времени."};
const F={en:"Films, videos and interactive programmes can make learning far more engaging than written texts alone. Moving images help people retain information and bring distant or abstract subjects to life. A well-made documentary about ancient Rome, for instance, can illustrate buildings, clothing and daily life in a way that pages of text simply cannot.",ru:"Фильмы, видео и интерактивные программы могут сделать обучение гораздо более увлекательным, чем одни письменные тексты. Движущиеся изображения помогают запоминать информацию и оживляют далёкие или абстрактные темы. Хорошо снятый документальный фильм о Древнем Риме, например, может показать здания, одежду и повседневную жизнь так, как это просто не под силу страницам текста."};
const INT={en:"The Internet now provides instant and largely free access to a vast amount of information. Many renowned libraries and museums have digitised their collections, allowing people worldwide to explore them from home. As a result, visiting a particular building is no longer essential simply to gain access to knowledge.",ru:"Интернет теперь обеспечивает мгновенный и в основном бесплатный доступ к огромному объёму информации. Многие известные библиотеки и музеи оцифровали свои коллекции, позволяя людям по всему миру изучать их из дома. В результате посещение конкретного здания больше не обязательно только ради доступа к знаниям."};
const HIST={en:"Information presented in films and online can be simplified, dramatised or unverified, whereas books, original documents and museum collections are generally reviewed by experts. A film depicting a historical event, for instance, may alter facts to make the story more compelling. Traditional sources therefore remain essential for those seeking reliable and accurate information.",ru:"Информация в фильмах и в интернете может быть упрощена, драматизирована или непроверена, тогда как книги, подлинные документы и музейные коллекции, как правило, проходят экспертную проверку. Фильм об историческом событии, например, может изменить факты, чтобы сделать сюжет более захватывающим. Поэтому традиционные источники остаются необходимыми для тех, кто ищет надёжную и точную информацию."};
const SCI={en:"Scientific research is a major driving force behind progress in medicine, technology and the economy. Discoveries made in laboratories lead to new treatments, cleaner energy and entire industries that create millions of jobs. The rapid development of COVID-19 vaccines, for example, saved millions of lives and enabled economies to reopen.",ru:"Научные исследования — главная движущая сила прогресса в медицине, технологиях и экономике. Открытия, сделанные в лабораториях, приводят к новым методам лечения, более чистой энергии и целым отраслям, создающим миллионы рабочих мест. Быстрая разработка вакцин от COVID-19, например, спасла миллионы жизней и позволила экономикам вновь открыться."};
const PRED={en:"It is impossible to predict in advance which research will ultimately prove valuable. Many discoveries that once seemed purely theoretical later led to major breakthroughs. Early studies of electricity and light, for instance, had no obvious practical purpose, yet eventually contributed to computers, lasers and the Internet.",ru:"Невозможно заранее предсказать, какие исследования в конечном итоге окажутся ценными. Многие открытия, которые когда-то казались чисто теоретическими, позже привели к крупным прорывам. Ранние исследования электричества и света, например, не имели очевидной практической цели, но в итоге способствовали появлению компьютеров, лазеров и интернета."};
const iC=["instant, free access > vast information","libraries digitised collections > explore from home","visiting building not essential > access to knowledge"],hC=["films, online > simplified, dramatised, unverified > books reviewed by experts","historical film > alter facts > compelling story","traditional sources > reliable, accurate"],sC=["research > driving force > medicine, technology, economy","laboratory discoveries > treatments, clean energy, jobs","COVID-19 vaccines > saved lives > economies reopen"],pC=["impossible to predict > valuable research","theoretical discoveries > later breakthroughs","electricity, light > no purpose > computers, lasers, Internet"];
const JOBS={en:"Many young people choose their careers largely on the basis of salary and job security. Rising living costs and fierce competition make them reluctant to take risks, so talented students may favour business, IT or law over science or the arts. As a result, personal interest increasingly gives way to practical considerations.",ru:"Многие молодые люди выбирают профессию в основном исходя из зарплаты и стабильности работы. Рост стоимости жизни и жёсткая конкуренция делают их неготовыми к риску, поэтому талантливые студенты могут отдавать предпочтение бизнесу, IT или юриспруденции, а не науке или искусству. В результате личный интерес всё чаще уступает место практическим соображениям."};
const SHORT={en:"When a country lacks qualified professionals, society as a whole suffers. Hospitals, universities and industries struggle to recruit doctors, engineers and researchers, while the quality of essential services declines. Many developing countries lose talented graduates to wealthier nations and are consequently forced to rely on expensive foreign specialists.",ru:"Когда в стране не хватает квалифицированных специалистов, страдает всё общество. Больницам, университетам и промышленности трудно набирать врачей, инженеров и исследователей, а качество важных услуг падает. Многие развивающиеся страны теряют талантливых выпускников в пользу более богатых государств и поэтому вынуждены полагаться на дорогих иностранных специалистов."};
const FIN={en:"Financial security remains a major reason why most people work. A stable income pays for housing, food, education and healthcare, and without sufficient money, it is difficult to enjoy other aspects of life. Surveys consistently suggest that higher pay remains one of the most common reasons people choose to change jobs.",ru:"Финансовая безопасность остаётся главной причиной, по которой большинство людей работают. Стабильный доход оплачивает жильё, еду, образование и здравоохранение, а без достаточных денег трудно наслаждаться другими сторонами жизни. Опросы последовательно показывают, что более высокая зарплата остаётся одной из самых частых причин смены работы."};
const jC=["salary, job security > career choice","living costs, competition > reluctant to take risks > business, IT, law","interest gives way > practical considerations"],shC=["lack of professionals > society suffers","hospitals, industries > struggle to recruit > services decline","developing countries > lose graduates > rely on foreign specialists"],fC=["financial security > why people work","stable income > housing, food, education, healthcare","higher pay > change jobs"];
const OLD={en:"When older people remain in employment for longer, younger people may find it harder to start their careers. Fewer positions become available, while opportunities for career progression may also be limited. In many countries, for instance, young people face intense competition for entry-level positions as older employees delay retirement.",ru:"Когда пожилые люди дольше остаются на работе, молодым людям может быть труднее начать карьеру. Освобождается меньше мест, а возможности карьерного роста тоже могут быть ограничены. Во многих странах, например, молодёжь сталкивается с острой конкуренцией за начальные должности, поскольку более старшие сотрудники откладывают выход на пенсию."};
const ABR={en:"Spending time in another country broadens people’s horizons in a way no textbook can. Living among people with different customs encourages them to become independent, adaptable and more tolerant, while daily interaction with local people greatly improves their language skills. These qualities are highly valued by employers, particularly in international companies.",ru:"Время, проведённое в другой стране, расширяет кругозор людей так, как не способен ни один учебник. Жизнь среди людей с другими обычаями побуждает становиться самостоятельными, гибкими и более терпимыми, а ежедневное общение с местными жителями значительно улучшает языковые навыки. Эти качества высоко ценят работодатели, особенно в международных компаниях."};
const oC=["older people stay longer > young start careers harder","fewer positions > limited progression","entry-level competition > delay retirement"],aC=["another country > broadens horizons > no textbook can","different customs > independent, adaptable, tolerant > local interaction > language","valued by employers > international companies"];
const D=[
{n:6,q:"The best way for countries to prepare for the future is to invest in young people. (Agree)",p:[
{c:["public funds","wide range of needs","concentrated","single area","neglect","harm society","ageing population","unfair and unwise"],
en:"Admittedly, governments cannot spend all their resources on the young. Public funds must cover a wide range of needs rather than being concentrated on a single area. Healthcare, education, infrastructure, public safety and care for the elderly are all essential, and neglecting any of them can eventually harm society as a whole. Poor infrastructure, for instance, increases safety risks, while underfunded hospitals affect people of all ages. Moreover, ageing populations require increasing spending on pensions and healthcare, so neglecting older citizens would be both unfair and unwise.",
ru:"Безусловно, правительства не могут тратить все ресурсы на молодёжь. Государственные средства должны покрывать широкий круг потребностей, а не концентрироваться в одной сфере. Здравоохранение, образование, инфраструктура, общественная безопасность и забота о пожилых — всё это необходимо, и пренебрежение любой из этих сфер в конечном счёте может навредить обществу в целом. Плохая инфраструктура, например, повышает риски для безопасности, а недофинансированные больницы затрагивают людей всех возрастов. Кроме того, стареющее население требует растущих расходов на пенсии и здравоохранение, поэтому пренебрегать пожилыми гражданами было бы и несправедливо, и неразумно.",
k:[["allocate public funds","распределять госсредства"],["address a wide range of needs","удовлетворять широкий круг потребностей"],["neglect a sector","пренебрегать сферой"],["underfunded hospitals","недофинансированные больницы"],["an ageing population","стареющее население"],["place a strain on pensions","создавать нагрузку на пенсии"]]},
{c:["Nevertheless","higher education","benefits society","doctors, engineers, teachers","higher taxes","long-term investment","early education","equal start"],
en:"Nevertheless, I believe investing in young people is the most effective way to secure a country’s future. University education benefits society as a whole, not merely individual graduates. Graduates become the doctors, engineers and teachers without whom hospitals, industries and schools could not function, while paying higher taxes throughout their careers. Public spending on higher education should therefore be viewed as a long-term investment rather than simply a cost. In addition, high-quality early education gives disadvantaged children an equal start, leading to better academic and economic outcomes later in life.",
ru:"Тем не менее, я считаю, что инвестиции в молодёжь — самый эффективный способ обеспечить будущее страны. Университетское образование приносит пользу обществу в целом, а не только отдельным выпускникам. Выпускники становятся врачами, инженерами и учителями, без которых не могли бы работать больницы, промышленность и школы, и при этом платят более высокие налоги на протяжении всей карьеры. Поэтому государственные расходы на высшее образование следует рассматривать как долгосрочную инвестицию, а не просто как издержки. Кроме того, качественное дошкольное образование даёт детям из неблагополучных семей равный старт, что ведёт к лучшим академическим и экономическим результатам в дальнейшей жизни.",
k:[["secure a country’s future","обеспечить будущее страны"],["benefit society as a whole","приносить пользу обществу в целом"],["a long-term investment","долгосрочная инвестиция"],["disadvantaged children","дети из неблагополучных семей"],["an equal start in life","равный старт в жизни"],["economic outcomes","экономические результаты"]]}]},
{n:7,q:"Why is university study harder than school? What can be done? (Causes → Solutions)",p:[
{c:["living away from family","cook, budget, bills","loneliness","part-time jobs","first year suffers","no daily checking","lose routine"],
en:"There are several reasons why students find university study more difficult. For many students, starting university means living away from their families for the first time. They suddenly have to cook, manage a budget and pay bills while coping with loneliness, and some must take part-time jobs to cover their expenses. As a result, their academic performance may suffer during the first year. Moreover, without teachers checking homework and attendance every day, many students lose the routine that once kept them motivated.",
ru:"Есть несколько причин, по которым учёба в университете даётся студентам труднее. Для многих поступление означает первую жизнь вдали от семьи. Им внезапно приходится готовить, планировать бюджет и оплачивать счета, справляясь при этом с одиночеством, а некоторым — подрабатывать, чтобы покрывать расходы. В результате успеваемость в первый год может снижаться. Кроме того, когда учителя больше не проверяют ежедневно домашние задания и посещаемость, многие студенты теряют режим, который раньше поддерживал их мотивацию.",
k:[["cope with loneliness","справляться с одиночеством"],["manage a budget","управлять бюджетом"],["cover expenses","покрывать расходы"],["academic performance may suffer","успеваемость может снизиться"],["lose the routine","потерять режим"],["stay motivated","сохранять мотивацию"]]},
{c:["stronger support","struggling students","study-skills courses","time management","personal tutors","identify early","timetables, deadlines, study groups"],
en:"Several measures could help students overcome these difficulties. Educational institutions should provide stronger support for students who are struggling. Short courses in study skills could teach them to manage their time and maintain concentration, while personal tutors could monitor their progress and offer guidance. In this way, difficulties can be identified and addressed before they become serious. Students themselves can also create weekly timetables, set personal deadlines and form study groups to replace the structure school once provided.",
ru:"Несколько мер могли бы помочь студентам преодолеть эти трудности. Учебные заведения должны оказывать более сильную поддержку тем, кто испытывает сложности. Краткие курсы по навыкам учёбы могли бы научить управлять временем и сохранять концентрацию, а персональные тьюторы — следить за прогрессом и давать советы. Так проблемы можно выявить и решить, пока они не стали серьёзными. Сами студенты тоже могут составлять недельные расписания, ставить личные дедлайны и создавать учебные группы, чтобы заменить структуру, которую раньше давала школа.",
k:[["overcome difficulties","преодолевать трудности"],["provide stronger support","оказывать более сильную поддержку"],["maintain concentration","сохранять концентрацию"],["monitor progress","следить за прогрессом"],["offer guidance","давать наставления"],["set personal deadlines","ставить личные дедлайны"]]}]},
{n:8,q:"More people move abroad for higher education. Do advantages outweigh disadvantages? (Advantages)",p:[
{c:["Admittedly","lack of professionals","services decline","brain drain","foreign specialists","budget alone","loneliness"],
en:"Admittedly, studying abroad has certain drawbacks. When a country lacks qualified professionals, society as a whole suffers. Hospitals, universities and industries struggle to recruit doctors, engineers and researchers, while the quality of essential services declines. Many developing countries lose talented graduates to wealthier nations and are consequently forced to rely on expensive foreign specialists. Moreover, students living abroad must manage budgets and bills alone while coping with loneliness, which can harm their academic performance in the first year.",
ru:"Безусловно, у обучения за границей есть недостатки. Когда в стране не хватает квалифицированных специалистов, страдает всё общество. Больницам, университетам и промышленности трудно набирать врачей, инженеров и исследователей, а качество важных услуг падает. Многие развивающиеся страны теряют талантливых выпускников в пользу более богатых государств и поэтому вынуждены полагаться на дорогих иностранных специалистов. Кроме того, студентам за рубежом приходится самим управлять бюджетом и счетами и справляться с одиночеством, что может вредить успеваемости в первый год.",
k:[["qualified professionals","квалифицированные специалисты"],["struggle to recruit","с трудом набирать кадры"],["essential services","жизненно важные услуги"],["lose talented graduates","терять талантливых выпускников"],["rely on foreign specialists","полагаться на иностранных специалистов"],["brain drain","утечка мозгов"]]},
{c:["Nevertheless","broadens horizons","independent, adaptable, tolerant","master a language","valued by employers","higher lifetime earnings","wider career opportunities"],
en:"Nevertheless, I believe the advantages of studying abroad are far greater. Spending time in another country broadens young people’s horizons in a way no textbook can. Living among people with different customs forces them to become independent, adaptable and more tolerant, while daily practice allows them to master a foreign language far faster than lessons at home. These qualities are highly valued by employers, particularly in international companies. In addition, degrees from respected foreign universities often lead to higher lifetime earnings and a much wider range of career opportunities.",
ru:"Тем не менее, я считаю, что преимущества обучения за границей гораздо весомее. Время, проведённое в другой стране, расширяет кругозор молодых людей так, как не способен ни один учебник. Жизнь среди людей с другими обычаями делает их самостоятельными, гибкими и более терпимыми, а ежедневная практика позволяет освоить иностранный язык намного быстрее, чем уроки дома. Эти качества высоко ценят работодатели, особенно в международных компаниях. Кроме того, дипломы уважаемых зарубежных университетов часто ведут к более высокому доходу в течение жизни и гораздо более широкому выбору карьерных возможностей.",
k:[["broaden horizons","расширять кругозор"],["different customs","другие обычаи"],["master a foreign language","овладеть иностранным языком"],["highly valued by employers","высоко ценятся работодателями"],["higher lifetime earnings","более высокий доход за жизнь"],["a wide range of career opportunities","широкий выбор карьерных возможностей"]]}]},
{n:9,q:"Work or travel after school? Work experience is more useful than travel. (Agree)",p:[
{c:["travelling","valuable experiences","broadens horizons","independent, adaptable","foreign language","plan routes, manage budgets","without family support"],
en:"It is true that travelling can offer valuable experiences. "+T.en+" Moreover, travelling independently forces young people to plan routes, manage budgets and solve problems without their families’ support.",
ru:"Действительно, путешествия могут дать ценный опыт. "+T.ru+" Кроме того, самостоятельные путешествия заставляют молодых людей планировать маршруты, управлять бюджетом и решать проблемы без поддержки семьи.",
k:[["offer valuable experiences","давать ценный опыт"],["broaden horizons","расширять кругозор"],["solve problems","решать проблемы"],["without family support","без поддержки семьи"],["international companies","международные компании"]]},
{c:["However","work experience","punctuality, responsibility","difficult people","value of effort","clearer sense of direction","save money","strengthen CVs"],
en:"However, I believe work experience is more useful for adult life. "+W.en+" In addition, working before university allows young people to save money for their studies and strengthen their CVs.",
ru:"Однако я считаю, что опыт работы полезнее для взрослой жизни. "+W.ru+" Кроме того, работа перед университетом позволяет молодым людям накопить деньги на учёбу и улучшить резюме.",
k:[["paid or voluntary work","оплачиваемая или волонтёрская работа"],["deal with difficult people","общаться с трудными людьми"],["the true value of effort","истинная ценность усилий"],["a clear sense of direction","чёткое понимание своего пути"],["strengthen a CV","улучшить резюме"]]}]},
{n:10,q:"Gap year before university: advantages and disadvantages for studies. (Advantages → Disadvantages)",p:[
{c:["break before university","older age","emotionally ready","motivated, focused","oldest pupils","higher grades","clearer idea"],
en:"Taking a break before university can benefit students’ later studies in several ways. Starting a new stage of education at a slightly older age often leads to better outcomes. Students who are emotionally ready are more motivated, more focused and better able to cope with pressure. Research in several countries has found that the oldest pupils in a class tend to achieve higher grades than the youngest, partly because they are more mature. Moreover, young people who have worked or travelled independently often return more confident and with a clearer idea of what they want to study.",
ru:"Перерыв перед университетом может положительно сказаться на последующей учёбе по нескольким причинам. Начало нового этапа образования в чуть более старшем возрасте часто приводит к лучшим результатам. Эмоционально готовые студенты более мотивированы, сосредоточены и лучше справляются с давлением. Исследования в нескольких странах показали, что самые старшие ученики в классе обычно получают более высокие оценки, чем самые младшие, отчасти потому, что они более зрелые. Кроме того, молодые люди, которые работали или самостоятельно путешествовали, часто возвращаются более уверенными и с более ясным представлением о том, что хотят изучать.",
k:[["take a break","взять паузу"],["emotionally ready","эмоционально готовый"],["cope with pressure","справляться с давлением"],["achieve higher grades","получать более высокие оценки"],["a clearer idea of","более ясное представление о"]]},
{c:["However","gap year","no fixed timetable","no one monitoring","discipline","motivation fades","COVID-19 online learning","lose interest"],
en:"However, a gap year can also have negative effects on students’ studies. Without a fixed timetable and someone monitoring their progress, many people find it extremely difficult to study effectively. Learning requires discipline, and once the daily routine of classes and deadlines disappears, motivation often fades with it. During the COVID-19 pandemic, for instance, many students who switched to online learning fell behind without teachers ensuring they attended classes and completed their work. In addition, travelling can be expensive, and some students who start earning money lose interest in returning to education altogether.",
ru:"Однако «год перерыва» может и негативно повлиять на учёбу. Без чёткого расписания и того, кто следит за прогрессом, многим очень трудно учиться эффективно. Учёба требует дисциплины, и когда исчезает ежедневный распорядок занятий и дедлайнов, мотивация часто угасает вместе с ним. Во время пандемии COVID-19, например, многие студенты, перешедшие на онлайн-обучение, отстали, потому что учителя не следили за посещаемостью и выполнением заданий. Кроме того, путешествия могут быть дорогими, а некоторые студенты, начав зарабатывать, теряют интерес к возвращению в образование вовсе.",
k:[["a fixed timetable","чёткое расписание"],["motivation fades","мотивация угасает"],["fall behind","отставать"],["switch to online learning","перейти на онлайн-обучение"],["lose interest in","терять интерес к"]]}]},
{n:11,q:"Compulsory unpaid community work for young adults: are drawbacks greater? (Benefits are greater)",p:[
{c:["Admittedly","compulsory","undermine benefits","reluctantly, minimal effort","boring and pointless","paid jobs","less income, less study time"],
en:"Admittedly, compulsory community work would have certain drawbacks. Making any activity compulsory can undermine the very benefits it is intended to provide. People who are forced to do something tend to approach it reluctantly, putting in minimal effort and developing a negative attitude towards it. Many adults, for instance, still remember subjects they were forced to study at school as boring and pointless. Moreover, many young adults already combine study with paid jobs, so unpaid obligations could reduce both their income and their study time.",
ru:"Безусловно, обязательные работы на благо общества имели бы определённые недостатки. Сделав любую деятельность обязательной, можно подорвать те самые выгоды, которые она должна приносить. Люди, которых к чему-то принуждают, обычно относятся к этому неохотно, прилагают минимум усилий и формируют негативное отношение. Многие взрослые, например, до сих пор помнят предметы, которые их заставляли изучать в школе, как скучные и бессмысленные. Кроме того, многие молодые люди уже совмещают учёбу с оплачиваемой работой, поэтому неоплачиваемые обязательства могли бы сократить и их доход, и время на учёбу.",
k:[["compulsory work","обязательная работа"],["undermine the benefits","подрывать выгоды"],["approach it reluctantly","относиться к этому неохотно"],["minimal effort","минимум усилий"],["combine study with work","совмещать учёбу с работой"]]},
{c:["Nevertheless","benefits outweigh","work experience","responsibility","clearer direction","helping elderly, charities","empathy, civic responsibility","extra support"],
en:"Nevertheless, I believe the benefits would outweigh these drawbacks. "+W.en+" In addition, helping elderly people or local charities develops empathy and civic responsibility, while communities gain much-needed extra support.",
ru:"Тем не менее, я считаю, что выгоды перевесят эти недостатки. "+W.ru+" Кроме того, помощь пожилым людям или местным благотворительным организациям развивает эмпатию и гражданскую ответственность, а сообщества получают столь необходимую дополнительную поддержку.",
k:[["outweigh the drawbacks","перевешивать недостатки"],["develop empathy","развивать эмпатию"],["civic responsibility","гражданская ответственность"],["local charities","местные благотворительные организации"],["much-needed support","столь необходимая поддержка"]]}]},
{n:12,q:"Parents teach children at home instead of school. Do advantages outweigh disadvantages? (Disadvantages outweigh)",p:[
{c:["Admittedly","homeschooling","own pace","pace set by majority","faster bored, slower fall behind","efficient, less stressful","online courses","cheap, flexible"],
en:"Admittedly, homeschooling has certain advantages. "+I.en+" Moreover, online courses and educational platforms now allow parents to provide lessons cheaply and flexibly, tailored to their children’s interests.",
ru:"Безусловно, у домашнего обучения есть определённые преимущества. "+I.ru+" Кроме того, онлайн-курсы и образовательные платформы теперь позволяют родителям давать уроки недорого и гибко, с учётом интересов детей.",
k:[["work at one’s own pace","заниматься в своём темпе"],["focus on what is difficult","сосредоточиться на трудном"],["fall behind","отставать"],["considerably less stressful","значительно менее стрессовый"],["tailored to interests","с учётом интересов"]]},
{c:["However","disadvantages more significant","qualified teacher","explain in different ways","correct mistakes before habits","same error for months","miss classmates","social and teamwork skills"],
en:"However, I believe the disadvantages of homeschooling are more significant. "+Tc.en+" In addition, children taught at home miss daily contact with classmates, which is essential for developing social and teamwork skills.",
ru:"Однако я считаю, что недостатки домашнего обучения весомее. "+Tc.ru+" Кроме того, дети, обучающиеся дома, лишены ежедневного общения с одноклассниками, которое необходимо для развития социальных навыков и навыков командной работы.",
k:[["a qualified teacher","квалифицированный учитель"],["explain difficult concepts","объяснять сложные понятия"],["identify mistakes","выявлять ошибки"],["become habits","превратиться в привычки"],["daily contact with classmates","ежедневный контакт с одноклассниками"]]}]},
{n:13,q:"Students learn better in groups or on their own? (Groups)",p:[
{c:["On the one hand","studying alone","own pace","majority sets pace","efficient, less stressful","discussions drift off topic","weaker members rely on others"],
en:"On the one hand, studying alone has clear benefits. "+I.en+" Moreover, group discussions often drift off topic, and weaker members may rely on others instead of learning themselves.",
ru:"С одной стороны, у учёбы в одиночку есть очевидные преимущества. "+I.ru+" Кроме того, групповые обсуждения часто уходят от темы, а более слабые участники могут полагаться на других вместо того, чтобы учиться самим.",
k:[["clear benefits","очевидные преимущества"],["the pace is set by the majority","темп задаёт большинство"],["drift off topic","уходить от темы"],["rely on others","полагаться на других"],["considerably less stressful","значительно менее стрессовый"]]},
{c:["On the other hand","learn better in groups","social and teamwork skills","listen, exchange ideas, resolve disagreements","workplace cooperation","explain to classmates","correct mistakes"],
en:"On the other hand, I believe students generally learn better in groups. "+G.en+" In addition, explaining an idea to classmates deepens understanding, while group members can correct each other’s mistakes.",
ru:"С другой стороны, я считаю, что в целом студенты учатся лучше в группах. "+G.ru+" Кроме того, объяснение идеи одноклассникам углубляет понимание, а члены группы могут исправлять ошибки друг друга.",
k:[["develop teamwork skills","развивать навыки командной работы"],["resolve disagreements","разрешать разногласия"],["take responsibility","брать на себя ответственность"],["a clear advantage","явное преимущество"],["deepen understanding","углублять понимание"]]}]},
{n:14,q:"Team activities teach more important life skills than activities done alone. (Agree)",p:[
{c:["Admittedly","activities alone","own pace","majority sets pace","efficient, less stressful","concentration, self-reliance","quiet members let others decide"],
en:"Admittedly, activities done alone also develop valuable skills. "+I.en+" Moreover, working alone teaches concentration and self-reliance, whereas in teams quieter members may let others make every decision.",
ru:"Безусловно, деятельность в одиночку тоже развивает ценные навыки. "+I.ru+" Кроме того, работа в одиночку учит концентрации и самостоятельности, тогда как в командах более тихие участники могут позволять другим принимать все решения.",
k:[["develop valuable skills","развивать ценные навыки"],["teach concentration","учить концентрации"],["self-reliance","самостоятельность"],["quieter members","более тихие участники"],["make every decision","принимать все решения"]]},
{c:["Nevertheless","team activities","social and teamwork skills","listen, exchange ideas","clear advantage","cooperation","shared responsibility","motivation, less likely to give up"],
en:"Nevertheless, I believe team activities teach more important skills for life. "+G.en+" In addition, shared responsibility increases motivation, since people are less likely to give up when others depend on them.",
ru:"Тем не менее, я считаю, что командная деятельность учит более важным жизненным навыкам. "+G.ru+" Кроме того, общая ответственность повышает мотивацию, так как люди реже сдаются, когда на них рассчитывают другие.",
k:[["essential in adult life","необходимый во взрослой жизни"],["as part of a team","как часть команды"],["require cooperation","требовать сотрудничества"],["shared responsibility","общая ответственность"],["give up","сдаваться"]]}]},
{n:15,q:"Adults learn practical skills (e.g. computers) alone, or with a teacher in a classroom? (Teacher)",p:[
{c:["On the one hand","adults learn by themselves","own pace","efficient, less stressful","online tutorials","cheap, flexible","convenient times"],
en:"On the one hand, some adults prefer to learn practical skills by themselves. "+I.en+" Moreover, online tutorials are cheap and flexible, allowing working adults to study at convenient times.",
ru:"С одной стороны, некоторые взрослые предпочитают осваивать практические навыки самостоятельно. "+I.ru+" Кроме того, онлайн-уроки дёшевы и гибки, что позволяет работающим взрослым учиться в удобное время.",
k:[["practical skills","практические навыки"],["learn by oneself","учиться самостоятельно"],["work at one’s own pace","заниматься в своём темпе"],["cheap and flexible","дёшевый и гибкий"],["at convenient times","в удобное время"]]},
{c:["On the other hand","learning with a teacher","qualified teacher","explain in different ways","correct before habits","same error for months","fixed timetable","discipline"],
en:"On the other hand, I believe learning with a teacher is usually more effective. "+Tc.en+" In addition, a fixed timetable and regular classes provide the discipline that many self-learners lack.",
ru:"С другой стороны, я считаю, что обучение с преподавателем обычно эффективнее. "+Tc.ru+" Кроме того, чёткое расписание и регулярные занятия дают дисциплину, которой многим самоучкам не хватает.",
k:[["more effective","более эффективный"],["rely solely on","полагаться только на"],["repeat the same error","повторять одну и ту же ошибку"],["a fixed timetable","чёткое расписание"],["lack discipline","испытывать нехватку дисциплины"]]}]},
{n:16,q:"Start school very early or when children are older? (Later)",p:[
{c:["On the one hand","early start","disadvantaged families","equal start","language, social skills, curiosity","better outcomes later","share, cooperate, make friends"],
en:"On the one hand, starting school early has some benefits. Early education gives children, particularly those from disadvantaged families, a more equal start in life. In a good nursery or school, young children develop language skills, social abilities and curiosity that their home environment may not provide. Research consistently suggests that high-quality early education is associated with better academic and economic outcomes later in life. Moreover, young children in nursery or school learn to share, cooperate and make friends at an early age.",
ru:"С одной стороны, раннее начало школы имеет некоторые преимущества. Раннее образование даёт детям, особенно из неблагополучных семей, более равный старт в жизни. В хорошем детском саду или школе маленькие дети развивают речь, социальные способности и любознательность, которых может не дать домашняя среда. Исследования последовательно показывают, что качественное раннее образование связано с лучшими академическими и экономическими результатами в дальнейшей жизни. Кроме того, маленькие дети в детском саду или школе учатся делиться, сотрудничать и заводить друзей в раннем возрасте.",
k:[["an equal start in life","равный старт в жизни"],["disadvantaged families","неблагополучные семьи"],["develop language skills","развивать речь"],["home environment","домашняя среда"],["be associated with","быть связанным с"]]},
{c:["On the other hand","starting later","excessive pressure","more harm than good","play, movement, exploration","Finland, age seven","emotionally ready"],
en:"On the other hand, I believe children benefit more from starting formal schooling later. Excessive academic pressure at a young age can do more harm than good. Young children learn best through play, movement and exploration rather than by sitting at a desk for hours. Finland, for example, does not begin formal schooling until the age of seven, yet consistently achieves excellent educational outcomes. In addition, older pupils tend to be more emotionally ready, more focused and better able to cope with pressure.",
ru:"С другой стороны, я считаю, что детям полезнее начинать формальное обучение позже. Чрезмерное академическое давление в раннем возрасте может принести больше вреда, чем пользы. Маленькие дети лучше всего учатся через игру, движение и исследование, а не сидя за партой часами. Финляндия, например, не начинает формальное обучение до семи лет, но стабильно добивается отличных результатов в образовании. Кроме того, более взрослые ученики, как правило, эмоционально более готовы, более сосредоточены и лучше справляются с давлением.",
k:[["formal schooling","формальное обучение"],["excessive academic pressure","чрезмерное академическое давление"],["do more harm than good","приносить больше вреда, чем пользы"],["learn through play","учиться через игру"],["excellent educational outcomes","отличные результаты в образовании"]]}]},
{n:17,q:"Parents should encourage physical activities over studying. (Agree)",p:[
{c:["Admittedly","academic study essential","access to higher education","well-paid careers","competitive universities","limit opportunities","fall behind, hard to catch up"],
en:"Admittedly, academic study remains essential for children’s future. Academic achievement still largely determines access to higher education and many well-paid careers. Strong results in subjects such as mathematics, science and languages are required for entry to competitive universities and professions. Neglecting study in favour of other activities may therefore limit young people’s future opportunities. Moreover, in competitive education systems, children who fall behind academically may find it very difficult to catch up later.",
ru:"Безусловно, учёба остаётся важной для будущего детей. Академические достижения по-прежнему во многом определяют доступ к высшему образованию и многим высокооплачиваемым профессиям. Высокие результаты по таким предметам, как математика, естественные науки и языки, необходимы для поступления в конкурентные университеты и на профессии. Поэтому пренебрежение учёбой в пользу других занятий может ограничить будущие возможности молодых людей. Кроме того, в конкурентных системах образования дети, отставшие в учёбе, могут с большим трудом наверстать упущенное позже.",
k:[["academic achievement","академические достижения"],["access to higher education","доступ к высшему образованию"],["well-paid careers","высокооплачиваемая карьера"],["limit future opportunities","ограничивать будущие возможности"],["catch up","наверстать упущенное"]]},
{c:["Nevertheless","physical activities","limit screen time","blood flow to brain","reduces stress","release energy","phone restrictions, breaks","obesity, healthy habits"],
en:"Nevertheless, I believe children should spend more time on physical activities. "+X.en+" In addition, regular exercise from an early age reduces the risk of obesity and builds healthy habits that continue into adulthood.",
ru:"Тем не менее, я считаю, что детям следует уделять больше времени физической активности. "+X.ru+" Кроме того, регулярные упражнения с раннего возраста снижают риск ожирения и формируют здоровые привычки, сохраняющиеся и во взрослой жизни.",
k:[["limit screen time","ограничивать экранное время"],["improve blood flow","улучшать кровоток"],["release energy","выплескивать энергию"],["noticeable improvements","заметные улучшения"],["reduce the risk of obesity","снижать риск ожирения"]]}]},
{n:18,q:"Children have difficulty concentrating in class. Reasons and solutions? (Causes → Solutions)",p:[
{c:["reasons","reading develops concentration","excessive screen use","short videos, instant stimulation","declining reading habits","late-night screens","overloaded schedules","exhausted"],
en:"There are several reasons why children struggle to concentrate in class. "+R.en+" Moreover, late-night screen use and overloaded schedules leave many pupils exhausted before lessons even begin.",
ru:"Есть несколько причин, по которым детям трудно сосредоточиться на уроке. "+R.ru+" Кроме того, использование экранов допозда и перегруженное расписание оставляют многих учеников измотанными ещё до начала уроков.",
k:[["struggle to concentrate","с трудом концентрироваться"],["excessive screen use","чрезмерное использование экранов"],["instant stimulation","мгновенная стимуляция"],["declining reading habits","снижение интереса к чтению"],["an overloaded schedule","перегруженное расписание"]]},
{c:["measures","limit screen time","physical activity","blood flow, stress","phone restrictions, breaks","study-skills sessions","personal tutors","identify struggling pupils early"],
en:"Several measures could help children concentrate better. "+X.en+" Schools can also offer study-skills sessions and personal tutors who identify struggling pupils early and help them develop better habits.",
ru:"Несколько мер могли бы помочь детям лучше концентрироваться. "+X.ru+" Школы также могут предлагать занятия по навыкам учёбы и персональных тьюторов, которые рано выявляют отстающих учеников и помогают им выработать лучшие привычки.",
k:[["concentrate better","лучше концентрироваться"],["restrict phone use","ограничивать использование телефонов"],["short physical breaks","короткие физические перерывы"],["identify struggling pupils","выявлять отстающих учеников"],["develop better habits","вырабатывать лучшие привычки"]]}]},
{n:19,q:"Schools should use films, computers and games instead of books. (Disagree)",p:[
{c:["Admittedly","technology","engaging","moving images, retain information","documentary, ancient Rome","digital skills"],
en:"Admittedly, technology can make lessons more effective. "+F.en+" Moreover, using computers in class develops digital skills that almost every modern profession now requires.",
ru:"Безусловно, технологии могут сделать уроки эффективнее. "+F.ru+" Кроме того, использование компьютеров на уроках развивает цифровые навыки, которые сегодня требует почти любая профессия.",
k:[["make learning engaging","делать обучение увлекательным"],["retain information","запоминать информацию"],["bring subjects to life","оживлять темы"],["abstract subjects","абстрактные темы"],["digital skills","цифровые навыки"]]},
{c:["However","books not replaced","concentration, imagination","screen use weakens skills","short videos","declining reading","less eye strain","no battery, no Internet"],
en:"However, I believe books should not be replaced in schools. "+R.en+" In addition, printed books cause less eye strain and require no battery or Internet connection, so they never fail during a lesson.",
ru:"Однако я считаю, что книги не следует заменять в школах. "+R.ru+" Кроме того, печатные книги меньше утомляют глаза и не требуют батареи или интернет-соединения, поэтому никогда не подводят во время урока.",
k:[["follow complex ideas","следовать сложным идеям"],["weaken these skills","ослаблять эти навыки"],["demanding tasks","требовательные задачи"],["for extended periods","в течение длительного времени"],["cause eye strain","утомлять глаза"]]}]},
{n:20,q:"Better to learn about the past through films than written documents. (Disagree)",p:[
{c:["Admittedly","films","engaging","moving images","documentary, Rome","larger audiences","spark interest in history"],
en:"Admittedly, films have some advantages as a way of learning about the past. "+F.en+" Moreover, documentaries reach far larger audiences than academic texts and can spark a genuine interest in history.",
ru:"Безусловно, у фильмов есть некоторые преимущества как способа узнавать о прошлом. "+F.ru+" Кроме того, документальные фильмы охватывают гораздо более широкую аудиторию, чем научные тексты, и могут вызвать настоящий интерес к истории.",
k:[["a well-made documentary","хорошо снятый документальный фильм"],["daily life","повседневная жизнь"],["reach larger audiences","охватывать более широкую аудиторию"],["academic texts","научные тексты"],["spark a genuine interest","вызвать настоящий интерес"]]},
{c:["However","written documents","simplified, dramatised, unverified","reviewed by experts","alter facts","reliable and accurate","letters, diaries, records","depth and detail"],
en:"However, I believe written documents remain the better source of historical knowledge. Information presented in films and online can be simplified, dramatised or unverified, whereas books, original documents and museum collections are generally reviewed by experts. A film depicting a historical event, for instance, may alter facts to make the story more compelling. Traditional sources therefore remain essential for those seeking reliable and accurate information. In addition, letters, diaries and official records offer depth and detail that a film limited to two hours cannot achieve.",
ru:"Однако я считаю, что письменные документы остаются лучшим источником исторических знаний. Информация, представленная в фильмах и в интернете, может быть упрощена, драматизирована или непроверена, тогда как книги, подлинные документы и музейные коллекции, как правило, проходят экспертную проверку. Фильм об историческом событии, например, может изменить факты, чтобы сделать сюжет более захватывающим. Поэтому традиционные источники остаются необходимыми для тех, кто ищет надёжную и точную информацию. Кроме того, письма, дневники и официальные записи дают глубину и детали, которых не может достичь фильм, ограниченный двумя часами.",
k:[["simplified or dramatised","упрощённый или драматизированный"],["reviewed by experts","прошедший экспертную проверку"],["alter facts","искажать факты"],["reliable and accurate information","надёжная и точная информация"],["official records","официальные записи"]]}]},
{n:21,q:"Information is online, so public libraries are no longer necessary. (Disagree)",p:[
{en:"Admittedly, the Internet has made some functions of libraries less necessary. "+INT.en+" Moreover, digital collections serve people in rural areas and those with disabilities, without the cost of maintaining buildings.",
ru:"Безусловно, интернет сделал некоторые функции библиотек менее необходимыми. "+INT.ru+" Кроме того, цифровые коллекции обслуживают жителей сельских районов и людей с ограниченными возможностями без затрат на содержание зданий.",
k:[["digitise collections","оцифровывать коллекции"],["instant access","мгновенный доступ"],["explore from home","изучать из дома"],["people with disabilities","люди с ограниченными возможностями"]]},
{en:"However, I believe public libraries remain necessary. Public libraries and museums serve a social role that extends far beyond storing information. They provide free access to knowledge for people who cannot afford books, computers or Internet access, while offering a quiet place to study. Closing them would therefore disproportionately affect the most disadvantaged members of society. In addition, books in libraries are carefully selected and checked, whereas much online information is simplified or unverified.",
ru:"Однако я считаю, что публичные библиотеки остаются необходимыми. Публичные библиотеки и музеи выполняют социальную роль, выходящую далеко за рамки хранения информации. Они предоставляют бесплатный доступ к знаниям тем, кто не может позволить себе книги, компьютеры или интернет, а также предлагают тихое место для учёбы. Поэтому их закрытие непропорционально сильно ударило бы по наиболее уязвимым членам общества. Кроме того, книги в библиотеках тщательно отбираются и проверяются, тогда как значительная часть онлайн-информации упрощена или непроверена.",
k:[["serve a social role","выполнять социальную роль"],["cannot afford books","не могут позволить себе книги"],["a quiet place to study","тихое место для учёбы"],["disproportionately affect","непропорционально затрагивать"]]}]},
{n:22,q:"Museums are no longer important because facts are on the Internet. (Disagree)",p:[
{en:"Admittedly, the Internet now offers easy access to cultural and historical information. "+INT.en+" Moreover, online collections can be explored by people who live far from museums or cannot afford to travel.",
ru:"Безусловно, интернет теперь предлагает лёгкий доступ к культурной и исторической информации. "+INT.ru+" Кроме того, онлайн-коллекции могут изучать люди, живущие далеко от музеев или не имеющие средств на поездки.",
k:[["easy access to","лёгкий доступ к"],["renowned museums","известные музеи"],["no longer essential","больше не обязателен"],["cannot afford to travel","не могут позволить себе поездки"]]},
{en:"However, I believe museums are still important. "+HIST.en+" In addition, museums offer free education and school trips that some children would otherwise never experience.",
ru:"Однако я считаю, что музеи по-прежнему важны. "+HIST.ru+" Кроме того, музеи предлагают бесплатное образование и школьные экскурсии, которых некоторые дети иначе никогда бы не получили.",
k:[["simplified or dramatised","упрощённый или драматизированный"],["reviewed by experts","проверенный экспертами"],["alter facts","искажать факты"],["reliable and accurate","надёжный и точный"]]}]},
{n:23,q:"Printed books are no longer necessary in the digital era? (Printed books are still important)",p:[
{en:"On the one hand, electronic storage offers clear advantages. "+INT.en+" Moreover, a single digital library can serve millions of readers, including those in remote areas, at very low cost.",
ru:"С одной стороны, электронное хранение даёт очевидные преимущества. "+INT.ru+" Кроме того, одна цифровая библиотека может обслуживать миллионы читателей, в том числе в отдалённых районах, при очень низких затратах.",
k:[["electronic storage","электронное хранение"],["a vast amount of","огромное количество"],["serve millions of readers","обслуживать миллионы читателей"],["at very low cost","при очень низких затратах"]]},
{en:"On the other hand, I believe printed books still play an important role. Printed books offer practical advantages that electronic devices cannot fully replicate. They require no battery or Internet connection, cause less digital eye strain and cannot disappear because of a technical failure. Moreover, some research suggests that people retain information read on paper better than information presented on a screen. In addition, reading longer printed texts develops the concentration that constant screen use tends to weaken.",
ru:"С другой стороны, я считаю, что печатные книги по-прежнему играют важную роль. Печатные книги дают практические преимущества, которые электронные устройства не могут полностью воспроизвести. Им не нужны батарея или интернет-соединение, они меньше утомляют глаза и не могут исчезнуть из-за технического сбоя. Кроме того, некоторые исследования показывают, что информация, прочитанная на бумаге, запоминается лучше, чем информация с экрана. Помимо этого, чтение длинных печатных текстов развивает концентрацию, которую постоянное использование экранов обычно ослабляет.",
k:[["play an important role","играть важную роль"],["require no battery","не требовать батареи"],["digital eye strain","цифровая усталость глаз"],["retain information","запоминать информацию"],["develop concentration","развивать концентрацию"]]}]},
{n:24,q:"Governments should invest more in science than in other subjects. (Disagree)",p:[
{en:"Admittedly, science deserves substantial public investment. "+SCI.en+" Moreover, urgent threats such as climate change and antibiotic resistance can only be solved through scientific research.",
ru:"Безусловно, наука заслуживает значительных государственных инвестиций. "+SCI.ru+" Кроме того, такие острые угрозы, как изменение климата и устойчивость к антибиотикам, можно решить только с помощью научных исследований.",
k:[["a major driving force","главная движущая сила"],["lead to new treatments","приводить к новым методам лечения"],["create millions of jobs","создавать миллионы рабочих мест"],["antibiotic resistance","устойчивость к антибиотикам"]]},
{en:"However, I believe other subjects deserve equal support. Other subjects, such as history, philosophy, literature and economics, are equally valuable to society. They help people understand human behaviour, make ethical decisions and preserve cultural identity in ways that science alone cannot. Current debates surrounding artificial intelligence clearly demonstrate why technological progress also requires ethical guidance. In addition, public funds must cover many essential needs, so concentrating money on one field could leave other important areas neglected.",
ru:"Однако я считаю, что другие предметы заслуживают равной поддержки. Другие предметы, такие как история, философия, литература и экономика, не менее ценны для общества. Они помогают людям понимать человеческое поведение, принимать этические решения и сохранять культурную идентичность так, как одна наука не может. Нынешние споры вокруг искусственного интеллекта ясно показывают, почему технологический прогресс также нуждается в этическом руководстве. Кроме того, государственные средства должны покрывать множество важных нужд, поэтому сосредоточение денег в одной сфере может оставить другие важные области без внимания.",
k:[["preserve cultural identity","сохранять культурную идентичность"],["make ethical decisions","принимать этические решения"],["require ethical guidance","требовать этического руководства"],["leave areas neglected","оставлять области без внимания"]]}]},
{n:25,q:"Postgraduate research money should only be used for scientific research. (Disagree)",p:[
{en:"Admittedly, scientific research often brings clear practical benefits. "+SCI.en+" Moreover, since funding is limited, it makes sense to direct it towards urgent problems such as disease and climate change.",
ru:"Безусловно, научные исследования часто приносят очевидную практическую пользу. "+SCI.ru+" Кроме того, поскольку финансирование ограничено, разумно направлять его на неотложные проблемы, такие как болезни и изменение климата.",
k:[["clear practical benefits","очевидная практическая польза"],["enable economies to reopen","позволить экономикам вновь открыться"],["direct funding towards","направлять финансирование на"],["urgent problems","неотложные проблемы"]]},
{en:"However, I believe government funding should not be limited to science. "+PRED.en+" In addition, history, philosophy and economics help societies make ethical decisions, which science alone cannot do.",
ru:"Однако я считаю, что государственное финансирование не должно ограничиваться наукой. "+PRED.ru+" Кроме того, история, философия и экономика помогают обществам принимать этические решения, чего одна наука сделать не может.",
k:[["impossible to predict","невозможно предсказать"],["prove valuable","оказаться ценным"],["purely theoretical","чисто теоретический"],["major breakthroughs","крупные прорывы"]]}]},
{n:26,q:"A lot of scientific research today is a waste of time and money. (Disagree)",p:[
{en:"Admittedly, some research brings little real benefit. A considerable amount of research funding is spent on projects with little practical value. Some studies merely replicate earlier work, while others reach conclusions that could have been predicted without extensive research. Since funding is limited, it should instead be directed towards urgent problems such as disease, food security and climate change. Moreover, some studies are funded mainly to promote companies’ products or meet publication targets rather than to solve real problems.",
ru:"Безусловно, некоторые исследования приносят мало реальной пользы. Значительная часть финансирования исследований тратится на проекты с малой практической ценностью. Некоторые исследования лишь повторяют прежние работы, а другие приходят к выводам, которые можно было предсказать без масштабных исследований. Поскольку финансирование ограничено, его следует вместо этого направлять на неотложные проблемы, такие как болезни, продовольственная безопасность и изменение климата. Кроме того, некоторые исследования финансируются в основном для продвижения продукции компаний или выполнения публикационных показателей, а не для решения реальных проблем.",
k:[["a considerable amount of","значительное количество"],["replicate earlier work","повторять прежние работы"],["publication targets","публикационные показатели"],["promote products","продвигать продукцию"]]},
{en:"However, I believe most scientific research is far from a waste. "+PRED.en+" In addition, research has produced vaccines, cleaner energy and new technologies that have saved millions of lives.",
ru:"Однако я считаю, что большинство научных исследований далеко не пустая трата. "+PRED.ru+" Кроме того, исследования дали вакцины, более чистую энергию и новые технологии, которые спасли миллионы жизней.",
k:[["far from a waste","далеко не пустая трата"],["prove valuable","оказаться ценным"],["major breakthroughs","крупные прорывы"],["save millions of lives","спасти миллионы жизней"]]}]},
{n:27,q:"Not enough students choose science: causes and effects on society. (Causes → Effects)",p:[
{en:"There are several reasons why fewer students choose science. "+JOBS.en+" Moreover, many students see science as difficult and abstract, especially when lessons are taught in poorly equipped laboratories.",
ru:"Есть несколько причин, по которым всё меньше студентов выбирают науку. "+JOBS.ru+" Кроме того, многие студенты считают науку трудной и абстрактной, особенно когда уроки проходят в плохо оснащённых лабораториях.",
k:[["on the basis of salary","исходя из зарплаты"],["job security","стабильность работы"],["reluctant to take risks","не готовый рисковать"],["give way to","уступать место"]]},
{en:"This trend could have serious effects on society. "+SHORT.en+" In addition, fewer scientists would slow progress in medicine and technology, which drive both public health and economic growth.",
ru:"Эта тенденция может иметь серьёзные последствия для общества. "+SHORT.ru+" Кроме того, уменьшение числа учёных замедлило бы прогресс в медицине и технологиях, которые двигают и здравоохранение, и экономический рост.",
k:[["lack qualified professionals","не хватать квалифицированных специалистов"],["struggle to recruit","с трудом набирать кадры"],["rely on foreign specialists","полагаться на иностранных специалистов"],["drive economic growth","двигать экономический рост"]]}]},
{n:28,q:"Young people should be free to choose jobs, or be realistic? Discuss both views. (Free choice)",p:[
{en:"On the one hand, there are good reasons for young people to be realistic. "+JOBS.en+" Moreover, fields such as the arts attract far more graduates than there are jobs, so following passion alone can lead to unemployment.",
ru:"С одной стороны, есть веские причины, по которым молодым людям стоит быть реалистами. "+JOBS.ru+" Кроме того, такие области, как искусство, привлекают гораздо больше выпускников, чем существует рабочих мест, поэтому следование одной лишь страсти может привести к безработице.",
k:[["be realistic","быть реалистичным"],["fierce competition","жёсткая конкуренция"],["practical considerations","практические соображения"],["lead to unemployment","привести к безработице"]]},
{en:"On the other hand, I believe young people should be free to choose their careers. People who pursue careers they are genuinely passionate about are more likely to succeed. Genuine interest motivates them to work harder, continue learning and persevere when difficulties arise. Young people should therefore be free to pursue their interests rather than being pushed into careers chosen by others. In addition, people who earn enough to live comfortably are driven more by meaningful work than by a higher salary.",
ru:"С другой стороны, я считаю, что молодые люди должны быть свободны в выборе профессии. Люди, которые выбирают профессию, к которой у них настоящая страсть, с большей вероятностью добьются успеха. Подлинный интерес мотивирует их усерднее работать, продолжать учиться и проявлять упорство, когда возникают трудности. Поэтому молодые люди должны иметь возможность следовать своим интересам, а не оказываться вынужденными идти в профессии, выбранные другими. Кроме того, люди, зарабатывающие достаточно для комфортной жизни, больше движимы осмысленной работой, чем более высокой зарплатой.",
k:[["genuinely passionate about","по-настоящему увлечён"],["persevere when difficulties arise","проявлять упорство при трудностях"],["pursue one’s interests","следовать своим интересам"],["meaningful work","осмысленная работа"]]}]},
{n:29,q:"Money is the most important motivating factor at work. (Disagree)",p:[
{en:"Admittedly, money is an important motivating factor. "+FIN.en+" Moreover, differences in pay reward effort and skill, encouraging people to study for years and accept demanding positions.",
ru:"Безусловно, деньги — важный мотивирующий фактор. "+FIN.ru+" Кроме того, разница в оплате вознаграждает усилия и навыки, побуждая людей годами учиться и занимать требовательные должности.",
k:[["financial security","финансовая безопасность"],["a stable income","стабильный доход"],["higher pay","более высокая зарплата"],["reward effort and skill","вознаграждать усилия и навыки"]]},
{en:"However, I believe money is not the most important factor. Money is not the only, or necessarily the most important, source of motivation. Once people earn enough to live comfortably, they may be driven more by meaningful work, recognition and opportunities for personal growth. Many teachers, doctors and volunteers, for example, accept demanding roles despite relatively modest financial rewards because they find their work fulfilling. In addition, many employees leave well-paid jobs because of stressful environments or poor management, which shows how much working conditions matter.",
ru:"Однако я считаю, что деньги не самый важный фактор. Деньги — не единственный и не обязательно самый важный источник мотивации. Когда люди зарабатывают достаточно для комфортной жизни, ими могут больше двигать осмысленная работа, признание и возможности для личного роста. Многие учителя, врачи и волонтёры, например, берутся за трудные роли, несмотря на сравнительно скромное денежное вознаграждение, потому что считают свою работу содержательной. Кроме того, многие сотрудники уходят с хорошо оплачиваемых мест из-за стрессовой обстановки или плохого руководства, что показывает, насколько важны условия труда.",
k:[["source of motivation","источник мотивации"],["personal growth","личный рост"],["find work fulfilling","считать работу содержательной"],["working conditions","условия труда"]]}]},
{n:30,q:"Why do some people work harder? Is it always good? (Reasons → not always good)",p:[
{en:"There are several reasons why some people work harder than others. "+FIN.en+" Moreover, children who grow up watching their parents work with dedication often come to regard hard work as normal.",
ru:"Есть несколько причин, по которым одни люди работают усерднее других. "+FIN.ru+" Кроме того, дети, растущие рядом с родителями, самоотверженно работающими, часто начинают считать упорный труд нормой.",
k:[["work with dedication","работать самоотверженно"],["sufficient money","достаточно денег"],["regard as normal","считать нормой"],["grow up watching","расти, наблюдая"]]},
{en:"However, working hard is not always a good thing. Working excessively, however admirable it may seem, often proves counterproductive. Overworked employees are less productive, more prone to mistakes and more likely to suffer from stress and burnout. A doctor working eighty-hour weeks, for instance, may endanger the very patients they are trying to help. In addition, excessive ambition can lead people to sacrifice their health, relationships and even their principles in pursuit of success.",
ru:"Однако упорный труд — не всегда хорошо. Чрезмерная работа, как бы восхитительно она ни выглядела, часто оказывается контрпродуктивной. Перегруженные работой сотрудники менее продуктивны, чаще допускают ошибки и с большей вероятностью страдают от стресса и выгорания. Врач, работающий по восемьдесят часов в неделю, например, может подвергать опасности тех самых пациентов, которым пытается помочь. Кроме того, чрезмерные амбиции могут заставить людей жертвовать здоровьем, отношениями и даже принципами ради успеха.",
k:[["prove counterproductive","оказаться контрпродуктивным"],["prone to mistakes","склонный к ошибкам"],["stress and burnout","стресс и выгорание"],["sacrifice one’s health","жертвовать здоровьем"]]}]},
{n:31,q:"Ambition is positive in society today. How important is it? Positive or negative? (Important and mainly positive)",p:[
{en:"Ambition is extremely important for those who want to succeed. Ambition is a powerful force behind both personal achievement and social progress. People who set ambitious goals are often willing to work hard, develop new skills and overcome obstacles that might discourage others. Without such individuals, many inventions, successful businesses and scientific breakthroughs might never have emerged. Moreover, ambitious people with clear long-term goals are more likely to recover from setbacks rather than give up.",
ru:"Амбиции крайне важны для тех, кто хочет добиться успеха. Амбиции — мощная сила, стоящая за личными достижениями и общественным прогрессом. Люди, ставящие амбициозные цели, часто готовы усердно трудиться, осваивать новые навыки и преодолевать препятствия, которые могли бы обескуражить других. Без таких людей многие изобретения, успешные компании и научные прорывы, возможно, никогда бы не появились. Кроме того, амбициозные люди с чёткими долгосрочными целями с большей вероятностью оправятся от неудач, а не сдадутся.",
k:[["a powerful force","мощная сила"],["set ambitious goals","ставить амбициозные цели"],["overcome obstacles","преодолевать препятствия"],["recover from setbacks","оправиться от неудач"]]},
{en:"However, ambition can become negative when it is excessive. When ambition becomes excessive, it can easily become destructive. Highly ambitious people may sacrifice their health, relationships and even personal principles in pursuit of success. Some business leaders, for instance, have committed fraud or exploited their employees in their pursuit of greater profit and power. In addition, people who become obsessed with success often work to the point of burnout, damaging their health and productivity.",
ru:"Однако амбиции могут стать негативными, когда они чрезмерны. Когда амбиции становятся чрезмерными, они легко становятся разрушительными. Очень амбициозные люди могут жертвовать здоровьем, отношениями и даже личными принципами ради успеха. Некоторые руководители бизнеса, например, совершали мошенничество или эксплуатировали сотрудников в погоне за большей прибылью и властью. Кроме того, люди, одержимые успехом, часто работают до выгорания, подрывая своё здоровье и продуктивность.",
k:[["become destructive","стать разрушительным"],["sacrifice one’s health","жертвовать здоровьем"],["commit fraud","совершать мошенничество"],["work to the point of burnout","работать до выгорания"]]}]},
{n:32,q:"Intelligence is the most important quality for a leader. (Disagree)",p:[
{en:"Admittedly, intelligence is a valuable quality for any leader. A leader must be capable of understanding complex information and making difficult decisions under pressure. Intelligence allows them to analyse problems, anticipate potential consequences and identify appropriate solutions. The head of a large company, for instance, must constantly assess markets, finances and risks, and a single poor decision can put thousands of jobs at risk. Moreover, modern leaders face complex problems, from economic crises to technological change, which require strong analytical skills.",
ru:"Безусловно, интеллект — ценное качество для любого лидера. Лидер должен уметь разбираться в сложной информации и принимать трудные решения под давлением. Интеллект позволяет анализировать проблемы, предвидеть возможные последствия и находить подходящие решения. Руководитель крупной компании, например, должен постоянно оценивать рынки, финансы и риски, а одно неудачное решение может поставить под угрозу тысячи рабочих мест. Кроме того, современные лидеры сталкиваются со сложными проблемами, от экономических кризисов до технологических изменений, которые требуют сильных аналитических навыков.",
k:[["make decisions under pressure","принимать решения под давлением"],["anticipate consequences","предвидеть последствия"],["put jobs at risk","ставить рабочие места под угрозу"],["analytical skills","аналитические навыки"]]},
{en:"However, I believe other qualities are more important. Intelligence alone, however, is not enough to make an effective leader. Qualities such as honesty, empathy and the ability to inspire others are equally important, since a leader’s success ultimately depends on the people they lead. History offers numerous examples of highly intelligent leaders who failed because they were unable to earn the trust of those around them. In addition, experience and decisiveness help leaders act under pressure, and many successful leaders rely on experts rather than their own intellect.",
ru:"Однако я считаю, что другие качества важнее. Один лишь интеллект, однако, не делает лидера эффективным. Такие качества, как честность, эмпатия и умение вдохновлять других, не менее важны, поскольку успех лидера в конечном счёте зависит от людей, которыми он руководит. История знает множество примеров очень умных лидеров, потерпевших неудачу, потому что они не смогли завоевать доверие окружающих. Кроме того, опыт и решительность помогают лидерам действовать под давлением, а многие успешные лидеры полагаются на экспертов, а не на собственный интеллект.",
k:[["effective leader","эффективный лидер"],["inspire others","вдохновлять других"],["earn the trust of","завоевать доверие"],["rely on experts","полагаться на экспертов"]]}]},
{n:33,q:"It is good for people to continue working in old age, if possible. (Agree)",p:[
{en:"Admittedly, older people continuing to work can cause some problems. "+OLD.en+" Moreover, after decades of work, many older people deserve to rest and spend time with their families.",
ru:"Безусловно, продолжение работы пожилыми людьми может вызывать некоторые проблемы. "+OLD.ru+" Кроме того, после десятилетий труда многие пожилые люди заслуживают отдыха и времени с семьёй.",
k:[["remain in employment","оставаться на работе"],["career progression","карьерный рост"],["entry-level positions","начальные должности"],["delay retirement","откладывать выход на пенсию"]]},
{en:"Nevertheless, I believe continuing to work can be a good idea for those who are able to. Continuing to work later in life can benefit older people themselves. Employment provides not only an income but also a daily routine, social interaction and a sense of purpose. Research suggests that people who remain active beyond the usual retirement age tend to stay healthier and experience less loneliness than those who stop working entirely. In addition, experienced older employees can train younger colleagues, passing on knowledge that took decades to build.",
ru:"Тем не менее, я считаю, что продолжение работы может быть хорошей идеей для тех, кто на это способен. Работа в более позднем возрасте может приносить пользу самим пожилым людям. Занятость даёт не только доход, но и распорядок дня, общение и ощущение цели. Исследования показывают, что люди, остающиеся активными после обычного пенсионного возраста, как правило, дольше сохраняют здоровье и меньше страдают от одиночества, чем те, кто полностью прекращает работать. Кроме того, опытные пожилые сотрудники могут обучать младших коллег, передавая знания, на накопление которых ушли десятилетия.",
k:[["a sense of purpose","ощущение цели"],["social interaction","общение"],["remain active","оставаться активным"],["pass on knowledge","передавать знания"]]}]},
{n:34,q:"More people compete with young people for the same jobs: problems and solutions. (Problems → Solutions)",p:[
{en:"This competition can cause several problems. "+OLD.en+" Moreover, older workers who lose their jobs to automation often struggle to retrain and compete with younger, tech-savvy candidates.",
ru:"Эта конкуренция может вызывать несколько проблем. "+OLD.ru+" Кроме того, пожилым работникам, потерявшим работу из-за автоматизации, часто трудно переучиться и конкурировать с более молодыми кандидатами, хорошо разбирающимися в технологиях.",
k:[["lose jobs to automation","терять работу из-за автоматизации"],["retrain","переучиваться"],["tech-savvy","разбирающийся в технологиях"],["intense competition","острая конкуренция"]]},
{en:"Several measures could reduce competition between generations. Governments and employers can take several measures to reduce competition between generations. Retraining programmes can help older workers update their skills, while laws against age discrimination ensure that candidates are judged on ability rather than age. Mentoring schemes, in which experienced employees train younger colleagues, can allow both generations to benefit. Phased retirement and part-time options would also allow older employees to reduce their hours while creating openings for younger colleagues.",
ru:"Несколько мер могли бы снизить конкуренцию между поколениями. Правительства и работодатели могут принять несколько мер для снижения конкуренции между поколениями. Программы переподготовки могут помочь пожилым работникам обновить навыки, а законы против возрастной дискриминации гарантируют, что кандидатов оценивают по способностям, а не по возрасту. Программы наставничества, в которых опытные сотрудники обучают молодых коллег, позволяют выиграть обоим поколениям. Поэтапный выход на пенсию и варианты неполной занятости также позволили бы пожилым сотрудникам сократить часы работы и освободить места для молодых коллег.",
k:[["retraining programmes","программы переподготовки"],["age discrimination","возрастная дискриминация"],["mentoring schemes","программы наставничества"],["phased retirement","поэтапный выход на пенсию"]]}]},
{n:35,q:"Many people change jobs and move: reasons; do advantages outweigh disadvantages? (Reasons → advantages outweigh)",p:[
