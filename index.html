<script>
const T={en:"Spending time in another country broadens young people’s horizons in a way no textbook can. Living among people with different customs forces them to become independent, adaptable and more tolerant, while daily practice allows them to master a foreign language far faster than lessons at home. These qualities are highly valued by employers, particularly in international companies.",ru:"Время, проведённое в другой стране, расширяет кругозор молодых людей так, как не способен ни один учебник. Жизнь среди людей с другими обычаями делает их самостоятельными, гибкими и более терпимыми, а ежедневная практика позволяет освоить иностранный язык намного быстрее, чем уроки дома. Эти качества высоко ценят работодатели, особенно в международных компаниях."};
const W={en:"Work experience, whether paid or voluntary, develops qualities that no classroom can teach, such as punctuality, responsibility and the ability to deal with difficult people. Young people who work also learn the true value of effort and discover which careers suit them. As a result, they enter university or employment more mature and with a much clearer sense of direction.",ru:"Опыт работы, оплачиваемой или волонтёрской, развивает качества, которым не может научить ни один класс: пунктуальность, ответственность и умение общаться с трудными людьми. Работающие молодые люди также узнают истинную ценность усилий и понимают, какие профессии им подходят. В результате они приходят в университет или на работу более зрелыми и с гораздо более чётким представлением о своём направлении."};
const I={en:"Learning individually allows people to work at their own pace and focus specifically on what they find difficult. In a group, the pace is set by the majority, so faster learners become bored while slower ones fall behind. As a result, individual learning can be more efficient and considerably less stressful.",ru:"Индивидуальное обучение позволяет заниматься в собственном темпе и сосредоточиться именно на том, что даётся трудно. В группе темп задаёт большинство, поэтому более быстрые ученики скучают, а более медленные отстают. В результате индивидуальное обучение может быть эффективнее и значительно менее стрессовым."};
const Tc={en:"A qualified teacher offers advantages that self-study cannot provide. Teachers explain difficult concepts in different ways, identify mistakes immediately and correct them before they become habits. A learner relying solely on online videos, by contrast, may repeat the same error for months without even realising it.",ru:"Квалифицированный учитель даёт преимущества, которых самообучение обеспечить не может. Учителя объясняют сложные понятия разными способами, сразу замечают ошибки и исправляют их, пока они не вошли в привычку. Ученик же, полагающийся только на онлайн-видео, может месяцами повторять одну и ту же ошибку, даже не осознавая этого."};
const G={en:"Learning alongside others develops social and teamwork skills that are essential in adult life. Working in a group teaches people to listen, exchange ideas, resolve disagreements and take responsibility as part of a team. These skills give them a clear advantage later, since almost every modern workplace requires cooperation with others.",ru:"Обучение рядом с другими развивает социальные навыки и навыки командной работы, необходимые во взрослой жизни. Работа в группе учит слушать, обмениваться идеями, разрешать разногласия и брать на себя ответственность как часть команды. Эти навыки дают явное преимущество в дальнейшем, поскольку почти любое современное рабочее место требует сотрудничества с другими."};
const X={en:"Parents and schools should limit children’s screen time and encourage more physical activity instead. Exercise improves blood flow to the brain, reduces stress and helps children release energy that might otherwise make them restless. Schools that restrict phone use and introduce short physical breaks between lessons often report noticeable improvements in concentration and behaviour.",ru:"Родителям и школам следует ограничивать экранное время детей и вместо этого поощрять больше физической активности. Упражнения улучшают приток крови к мозгу, снижают стресс и помогают детям выплеснуть энергию, которая иначе делала бы их беспокойными. Школы, ограничивающие использование телефонов и вводящие короткие физические перерывы между уроками, часто сообщают о заметном улучшении концентрации и поведения."};
const R={en:"Reading develops concentration, imagination and the ability to follow complex ideas, whereas excessive screen use can weaken these skills. Short videos accustom the brain to instant stimulation, making longer and more demanding tasks increasingly difficult to sustain. Consequently, declining reading habits may partly explain why many young people struggle to concentrate for extended periods.",ru:"Чтение развивает концентрацию, воображение и способность следовать сложным идеям, тогда как чрезмерное использование экранов может ослабить эти навыки. Короткие видео приучают мозг к мгновенной стимуляции, из-за чего всё труднее выдерживать более длинные и требовательные задачи. Следовательно, снижение интереса к чтению может отчасти объяснять, почему многим молодым людям трудно концентрироваться в течение длительного времени."};
const F={en:"Films, videos and interactive programmes can make learning far more engaging than written texts alone. Moving images help people retain information and bring distant or abstract subjects to life. A well-made documentary about ancient Rome, for instance, can illustrate buildings, clothing and daily life in a way that pages of text simply cannot.",ru:"Фильмы, видео и интерактивные программы могут сделать обучение гораздо более увлекательным, чем одни письменные тексты. Движущиеся изображения помогают запоминать информацию и оживляют далёкие или абстрактные темы. Хорошо снятый документальный фильм о Древнем Риме, например, может показать здания, одежду и повседневную жизнь так, как это просто не под силу страницам текста."};
const D=[
{n:6,q:"The best way for countries to prepare for the future is to invest in young people. (Agree)",p:[
{c:["public funds","wide range of needs","concentrated","single area","neglect","harm society","ageing population","unfair and unwise"],
en:"Admittedly, governments cannot spend all their resources on the young. Public funds must cover a wide range of needs rather than being concentrated on a single area. Healthcare, education, infrastructure, public safety and care for the elderly are all essential, and neglecting any of them can eventually harm society as a whole. Poor infrastructure, for instance, increases safety risks, while underfunded hospitals affect people of all ages. Moreover, ageing populations require increasing spending on pensions and healthcare, so neglecting older citizens would be both unfair and unwise.",
ru:"Безусловно, правительства не могут тратить все ресурсы на молодёжь. Государственные средства должны покрывать широкий круг потребностей, а не концентрироваться в одной сфере. Здравоохранение, образование, инфраструктура, общественная безопасность и забота о пожилых — всё это необходимо, и пренебрежение любой из этих сфер в конечном счёте может навредить обществу в целом. Плохая инфраструктура, например, повышает риски для безопасности, а недофинансированные больницы затрагивают людей всех возрастов. Кроме того, стареющее население требует растущих расходов на пенсии и здравоохранение, поэтому пренебрегать пожилыми гражданами было бы и несправедливо, и неразумно.",
k:[["allocate public funds","распределять госсредства"],["address a wide range of needs","удовлетворять широкий круг потребностей"],["neglect a sector","пренебрегать сферой"],["underfunded hospitals","недофинансированные больницы"],["an ageing population","стареющее население"],["place a strain on pensions","создавать нагрузку на пенсии"]]},
{c:["Nevertheless","higher education","benefits society","doctors, engineers, teachers","higher taxes","long-term investment","early education","equal start"],
en:"Nevertheless, I believe investing in young people is the most effective way to secure a country’s future. University education benefits society as a whole, not merely individual graduates. Graduates become the doctors, engineers and teachers without whom hospitals, industries and schools could not function, while paying higher taxes throughout their careers. Public spending on higher education should therefore be viewed as a long-term investment rather than simply a cost. In addition, high-quality early education gives disadvantaged children an equal start, leading to better academic and economic outcomes later in life.",
ru:"Тем не менее, я считаю, что инвестиции в молодёжь — самый эффективный способ обеспечить будущее страны. Университетское образование приносит пользу обществу в целом, а не только отдельным выпускникам. Выпускники становятся врачами, инженерами и учителями, без которых не могли бы работать больницы, промышленность и школы, и при этом платят более высокие налоги на протяжении всей карьеры. Поэтому государственные расходы на высшее образование следует рассматривать как долгосрочную инвестицию, а не просто как издержки. Кроме того, качественное дошкольное образование даёт детям из неблагополучных семей равный старт, что ведёт к лучшим академическим и экономическим результатам в дальнейшей жизни.",
k:[["secure a country’s future","обеспечить будущее страны"],["benefit society as a whole","приносить пользу обществу в целом"],["a long-term investment","долгосрочная инвестиция"],["disadvantaged children","дети из неблагополучных семей"],["an equal start in life","равный старт в жизни"],["economic outcomes","экономические результаты"]]}]},
{n:7,q:"Why is university study harder than school? What can be done? (Causes → Solutions)",p:[
{c:["living away from family","cook, budget, bills","loneliness","part-time jobs","first year suffers","no daily checking","lose routine"],
en:"There are several reasons why students find university study more difficult. For many students, starting university means living away from their families for the first time. They suddenly have to cook, manage a budget and pay bills while coping with loneliness, and some must take part-time jobs to cover their expenses. As a result, their academic performance may suffer during the first year. Moreover, without teachers checking homework and attendance every day, many students lose the routine that once kept them motivated.",
ru:"Есть несколько причин, по которым учёба в университете даётся студентам труднее. Для многих поступление означает первую жизнь вдали от семьи. Им внезапно приходится готовить, планировать бюджет и оплачивать счета, справляясь при этом с одиночеством, а некоторым — подрабатывать, чтобы покрывать расходы. В результате успеваемость в первый год может снижаться. Кроме того, когда учителя больше не проверяют ежедневно домашние задания и посещаемость, многие студенты теряют режим, который раньше поддерживал их мотивацию.",
k:[["cope with loneliness","справляться с одиночеством"],["manage a budget","управлять бюджетом"],["cover expenses","покрывать расходы"],["academic performance may suffer","успеваемость может снизиться"],["lose the routine","потерять режим"],["stay motivated","сохранять мотивацию"]]},
{c:["stronger support","struggling students","study-skills courses","time management","personal tutors","identify early","timetables, deadlines, study groups"],
en:"Several measures could help students overcome these difficulties. Educational institutions should provide stronger support for students who are struggling. Short courses in study skills could teach them to manage their time and maintain concentration, while personal tutors could monitor their progress and offer guidance. In this way, difficulties can be identified and addressed before they become serious. Students themselves can also create weekly timetables, set personal deadlines and form study groups to replace the structure school once provided.",
ru:"Несколько мер могли бы помочь студентам преодолеть эти трудности. Учебные заведения должны оказывать более сильную поддержку тем, кто испытывает сложности. Краткие курсы по навыкам учёбы могли бы научить управлять временем и сохранять концентрацию, а персональные тьюторы — следить за прогрессом и давать советы. Так проблемы можно выявить и решить, пока они не стали серьёзными. Сами студенты тоже могут составлять недельные расписания, ставить личные дедлайны и создавать учебные группы, чтобы заменить структуру, которую раньше давала школа.",
k:[["overcome difficulties","преодолевать трудности"],["provide stronger support","оказывать более сильную поддержку"],["maintain concentration","сохранять концентрацию"],["monitor progress","следить за прогрессом"],["offer guidance","давать наставления"],["set personal deadlines","ставить личные дедлайны"]]}]},
{n:8,q:"More people move abroad for higher education. Do advantages outweigh disadvantages? (Advantages)",p:[
{c:["Admittedly","lack of professionals","services decline","brain drain","foreign specialists","budget alone","loneliness"],
en:"Admittedly, studying abroad has certain drawbacks. When a country lacks qualified professionals, society as a whole suffers. Hospitals, universities and industries struggle to recruit doctors, engineers and researchers, while the quality of essential services declines. Many developing countries lose talented graduates to wealthier nations and are consequently forced to rely on expensive foreign specialists. Moreover, students living abroad must manage budgets and bills alone while coping with loneliness, which can harm their academic performance in the first year.",
ru:"Безусловно, у обучения за границей есть недостатки. Когда в стране не хватает квалифицированных специалистов, страдает всё общество. Больницам, университетам и промышленности трудно набирать врачей, инженеров и исследователей, а качество важных услуг падает. Многие развивающиеся страны теряют талантливых выпускников в пользу более богатых государств и поэтому вынуждены полагаться на дорогих иностранных специалистов. Кроме того, студентам за рубежом приходится самим управлять бюджетом и счетами и справляться с одиночеством, что может вредить успеваемости в первый год.",
k:[["qualified professionals","квалифицированные специалисты"],["struggle to recruit","с трудом набирать кадры"],["essential services","жизненно важные услуги"],["lose talented graduates","терять талантливых выпускников"],["rely on foreign specialists","полагаться на иностранных специалистов"],["brain drain","утечка мозгов"]]},
{c:["Nevertheless","broadens horizons","independent, adaptable, tolerant","master a language","valued by employers","higher lifetime earnings","wider career opportunities"],
en:"Nevertheless, I believe the advantages of studying abroad are far greater. Spending time in another country broadens young people’s horizons in a way no textbook can. Living among people with different customs forces them to become independent, adaptable and more tolerant, while daily practice allows them to master a foreign language far faster than lessons at home. These qualities are highly valued by employers, particularly in international companies. In addition, degrees from respected foreign universities often lead to higher lifetime earnings and a much wider range of career opportunities.",
ru:"Тем не менее, я считаю, что преимущества обучения за границей гораздо весомее. Время, проведённое в другой стране, расширяет кругозор молодых людей так, как не способен ни один учебник. Жизнь среди людей с другими обычаями делает их самостоятельными, гибкими и более терпимыми, а ежедневная практика позволяет освоить иностранный язык намного быстрее, чем уроки дома. Эти качества высоко ценят работодатели, особенно в международных компаниях. Кроме того, дипломы уважаемых зарубежных университетов часто ведут к более высокому доходу в течение жизни и гораздо более широкому выбору карьерных возможностей.",
k:[["broaden horizons","расширять кругозор"],["different customs","другие обычаи"],["master a foreign language","овладеть иностранным языком"],["highly valued by employers","высоко ценятся работодателями"],["higher lifetime earnings","более высокий доход за жизнь"],["a wide range of career opportunities","широкий выбор карьерных возможностей"]]}]},
{n:9,q:"Work or travel after school? Work experience is more useful than travel. (Agree)",p:[
{c:["travelling","valuable experiences","broadens horizons","independent, adaptable","foreign language","plan routes, manage budgets","without family support"],
en:"It is true that travelling can offer valuable experiences. "+T.en+" Moreover, travelling independently forces young people to plan routes, manage budgets and solve problems without their families’ support.",
ru:"Действительно, путешествия могут дать ценный опыт. "+T.ru+" Кроме того, самостоятельные путешествия заставляют молодых людей планировать маршруты, управлять бюджетом и решать проблемы без поддержки семьи.",
k:[["offer valuable experiences","давать ценный опыт"],["broaden horizons","расширять кругозор"],["solve problems","решать проблемы"],["without family support","без поддержки семьи"],["international companies","международные компании"]]},
{c:["However","work experience","punctuality, responsibility","difficult people","value of effort","clearer sense of direction","save money","strengthen CVs"],
en:"However, I believe work experience is more useful for adult life. "+W.en+" In addition, working before university allows young people to save money for their studies and strengthen their CVs.",
ru:"Однако я считаю, что опыт работы полезнее для взрослой жизни. "+W.ru+" Кроме того, работа перед университетом позволяет молодым людям накопить деньги на учёбу и улучшить резюме.",
k:[["paid or voluntary work","оплачиваемая или волонтёрская работа"],["deal with difficult people","общаться с трудными людьми"],["the true value of effort","истинная ценность усилий"],["a clear sense of direction","чёткое понимание своего пути"],["strengthen a CV","улучшить резюме"]]}]},
{n:10,q:"Gap year before university: advantages and disadvantages for studies. (Advantages → Disadvantages)",p:[
{c:["break before university","older age","emotionally ready","motivated, focused","oldest pupils","higher grades","clearer idea"],
en:"Taking a break before university can benefit students’ later studies in several ways. Starting a new stage of education at a slightly older age often leads to better outcomes. Students who are emotionally ready are more motivated, more focused and better able to cope with pressure. Research in several countries has found that the oldest pupils in a class tend to achieve higher grades than the youngest, partly because they are more mature. Moreover, young people who have worked or travelled independently often return more confident and with a clearer idea of what they want to study.",
ru:"Перерыв перед университетом может положительно сказаться на последующей учёбе по нескольким причинам. Начало нового этапа образования в чуть более старшем возрасте часто приводит к лучшим результатам. Эмоционально готовые студенты более мотивированы, сосредоточены и лучше справляются с давлением. Исследования в нескольких странах показали, что самые старшие ученики в классе обычно получают более высокие оценки, чем самые младшие, отчасти потому, что они более зрелые. Кроме того, молодые люди, которые работали или самостоятельно путешествовали, часто возвращаются более уверенными и с более ясным представлением о том, что хотят изучать.",
k:[["take a break","взять паузу"],["emotionally ready","эмоционально готовый"],["cope with pressure","справляться с давлением"],["achieve higher grades","получать более высокие оценки"],["a clearer idea of","более ясное представление о"]]},
{c:["However","gap year","no fixed timetable","no one monitoring","discipline","motivation fades","COVID-19 online learning","lose interest"],
en:"However, a gap year can also have negative effects on students’ studies. Without a fixed timetable and someone monitoring their progress, many people find it extremely difficult to study effectively. Learning requires discipline, and once the daily routine of classes and deadlines disappears, motivation often fades with it. During the COVID-19 pandemic, for instance, many students who switched to online learning fell behind without teachers ensuring they attended classes and completed their work. In addition, travelling can be expensive, and some students who start earning money lose interest in returning to education altogether.",
ru:"Однако «год перерыва» может и негативно повлиять на учёбу. Без чёткого расписания и того, кто следит за прогрессом, многим очень трудно учиться эффективно. Учёба требует дисциплины, и когда исчезает ежедневный распорядок занятий и дедлайнов, мотивация часто угасает вместе с ним. Во время пандемии COVID-19, например, многие студенты, перешедшие на онлайн-обучение, отстали, потому что учителя не следили за посещаемостью и выполнением заданий. Кроме того, путешествия могут быть дорогими, а некоторые студенты, начав зарабатывать, теряют интерес к возвращению в образование вовсе.",
k:[["a fixed timetable","чёткое расписание"],["motivation fades","мотивация угасает"],["fall behind","отставать"],["switch to online learning","перейти на онлайн-обучение"],["lose interest in","терять интерес к"]]}]},
{n:11,q:"Compulsory unpaid community work for young adults: are drawbacks greater? (Benefits are greater)",p:[
{c:["Admittedly","compulsory","undermine benefits","reluctantly, minimal effort","boring and pointless","paid jobs","less income, less study time"],
en:"Admittedly, compulsory community work would have certain drawbacks. Making any activity compulsory can undermine the very benefits it is intended to provide. People who are forced to do something tend to approach it reluctantly, putting in minimal effort and developing a negative attitude towards it. Many adults, for instance, still remember subjects they were forced to study at school as boring and pointless. Moreover, many young adults already combine study with paid jobs, so unpaid obligations could reduce both their income and their study time.",
ru:"Безусловно, обязательные работы на благо общества имели бы определённые недостатки. Сделав любую деятельность обязательной, можно подорвать те самые выгоды, которые она должна приносить. Люди, которых к чему-то принуждают, обычно относятся к этому неохотно, прилагают минимум усилий и формируют негативное отношение. Многие взрослые, например, до сих пор помнят предметы, которые их заставляли изучать в школе, как скучные и бессмысленные. Кроме того, многие молодые люди уже совмещают учёбу с оплачиваемой работой, поэтому неоплачиваемые обязательства могли бы сократить и их доход, и время на учёбу.",
k:[["compulsory work","обязательная работа"],["undermine the benefits","подрывать выгоды"],["approach it reluctantly","относиться к этому неохотно"],["minimal effort","минимум усилий"],["combine study with work","совмещать учёбу с работой"]]},
{c:["Nevertheless","benefits outweigh","work experience","responsibility","clearer direction","helping elderly, charities","empathy, civic responsibility","extra support"],
en:"Nevertheless, I believe the benefits would outweigh these drawbacks. "+W.en+" In addition, helping elderly people or local charities develops empathy and civic responsibility, while communities gain much-needed extra support.",
ru:"Тем не менее, я считаю, что выгоды перевесят эти недостатки. "+W.ru+" Кроме того, помощь пожилым людям или местным благотворительным организациям развивает эмпатию и гражданскую ответственность, а сообщества получают столь необходимую дополнительную поддержку.",
k:[["outweigh the drawbacks","перевешивать недостатки"],["develop empathy","развивать эмпатию"],["civic responsibility","гражданская ответственность"],["local charities","местные благотворительные организации"],["much-needed support","столь необходимая поддержка"]]}]},

{n:16,q:"Start school very early or when children are older? (Later)",p:[
{c:["On the one hand","early start","disadvantaged families","equal start","language, social skills, curiosity","better outcomes later","share, cooperate, make friends"],
en:"On the one hand, starting school early has some benefits. Early education gives children, particularly those from disadvantaged families, a more equal start in life. In a good nursery or school, young children develop language skills, social abilities and curiosity that their home environment may not provide. Research consistently suggests that high-quality early education is associated with better academic and economic outcomes later in life. Moreover, young children in nursery or school learn to share, cooperate and make friends at an early age.",
ru:"С одной стороны, раннее начало школы имеет некоторые преимущества. Раннее образование даёт детям, особенно из неблагополучных семей, более равный старт в жизни. В хорошем детском саду или школе маленькие дети развивают речь, социальные способности и любознательность, которых может не дать домашняя среда. Исследования последовательно показывают, что качественное раннее образование связано с лучшими академическими и экономическими результатами в дальнейшей жизни. Кроме того, маленькие дети в детском саду или школе учатся делиться, сотрудничать и заводить друзей в раннем возрасте.",
k:[["an equal start in life","равный старт в жизни"],["disadvantaged families","неблагополучные семьи"],["develop language skills","развивать речь"],["home environment","домашняя среда"],["be associated with","быть связанным с"]]},
{c:["On the other hand","starting later","excessive pressure","more harm than good","play, movement, exploration","Finland, age seven","emotionally ready"],
en:"On the other hand, I believe children benefit more from starting formal schooling later. Excessive academic pressure at a young age can do more harm than good. Young children learn best through play, movement and exploration rather than by sitting at a desk for hours. Finland, for example, does not begin formal schooling until the age of seven, yet consistently achieves excellent educational outcomes. In addition, older pupils tend to be more emotionally ready, more focused and better able to cope with pressure.",
ru:"С другой стороны, я считаю, что детям полезнее начинать формальное обучение позже. Чрезмерное академическое давление в раннем возрасте может принести больше вреда, чем пользы. Маленькие дети лучше всего учатся через игру, движение и исследование, а не сидя за партой часами. Финляндия, например, не начинает формальное обучение до семи лет, но стабильно добивается отличных результатов в образовании. Кроме того, более взрослые ученики, как правило, эмоционально более готовы, более сосредоточены и лучше справляются с давлением.",
k:[["formal schooling","формальное обучение"],["excessive academic pressure","чрезмерное академическое давление"],["do more harm than good","приносить больше вреда, чем пользы"],["learn through play","учиться через игру"],["excellent educational outcomes","отличные результаты в образовании"]]}]},
{n:17,q:"Parents should encourage physical activities over studying. (Agree)",p:[
{c:["Admittedly","academic study essential","access to higher education","well-paid careers","competitive universities","limit opportunities","fall behind, hard to catch up"],
en:"Admittedly, academic study remains essential for children’s future. Academic achievement still largely determines access to higher education and many well-paid careers. Strong results in subjects such as mathematics, science and languages are required for entry to competitive universities and professions. Neglecting study in favour of other activities may therefore limit young people’s future opportunities. Moreover, in competitive education systems, children who fall behind academically may find it very difficult to catch up later.",
ru:"Безусловно, учёба остаётся важной для будущего детей. Академические достижения по-прежнему во многом определяют доступ к высшему образованию и многим высокооплачиваемым профессиям. Высокие результаты по таким предметам, как математика, естественные науки и языки, необходимы для поступления в конкурентные университеты и на профессии. Поэтому пренебрежение учёбой в пользу других занятий может ограничить будущие возможности молодых людей. Кроме того, в конкурентных системах образования дети, отставшие в учёбе, могут с большим трудом наверстать упущенное позже.",
k:[["academic achievement","академические достижения"],["access to higher education","доступ к высшему образованию"],["well-paid careers","высокооплачиваемая карьера"],["limit future opportunities","ограничивать будущие возможности"],["catch up","наверстать упущенное"]]},
{c:["Nevertheless","physical activities","limit screen time","blood flow to brain","reduces stress","release energy","phone restrictions, breaks","obesity, healthy habits"],
en:"Nevertheless, I believe children should spend more time on physical activities. "+X.en+" In addition, regular exercise from an early age reduces the risk of obesity and builds healthy habits that continue into adulthood.",
ru:"Тем не менее, я считаю, что детям следует уделять больше времени физической активности. "+X.ru+" Кроме того, регулярные упражнения с раннего возраста снижают риск ожирения и формируют здоровые привычки, сохраняющиеся и во взрослой жизни.",
k:[["limit screen time","ограничивать экранное время"],["improve blood flow","улучшать кровоток"],["release energy","выплескивать энергию"],["noticeable improvements","заметные улучшения"],["reduce the risk of obesity","снижать риск ожирения"]]}]},

{c:["However","written documents","simplified, dramatised, unverified","reviewed by experts","alter facts","reliable and accurate","letters, diaries, records","depth and detail"],
en:"However, I believe written documents remain the better source of historical knowledge. Information presented in films and online can be simplified, dramatised or unverified, whereas books, original documents and museum collections are generally reviewed by experts. A film depicting a historical event, for instance, may alter facts to make the story more compelling. Traditional sources therefore remain essential for those seeking reliable and accurate information. In addition, letters, diaries and official records offer depth and detail that a film limited to two hours cannot achieve.",
ru:"Однако я считаю, что письменные документы остаются лучшим источником исторических знаний. Информация, представленная в фильмах и в интернете, может быть упрощена, драматизирована или непроверена, тогда как книги, подлинные документы и музейные коллекции, как правило, проходят экспертную проверку. Фильм об историческом событии, например, может изменить факты, чтобы сделать сюжет более захватывающим. Поэтому традиционные источники остаются необходимыми для тех, кто ищет надёжную и точную информацию. Кроме того, письма, дневники и официальные записи дают глубину и детали, которых не может достичь фильм, ограниченный двумя часами.",
k:[["simplified or dramatised","упрощённый или драматизированный"],["reviewed by experts","прошедший экспертную проверку"],["alter facts","искажать факты"],["reliable and accurate information","надёжная и точная информация"],["official records","официальные записи"]]}]}
